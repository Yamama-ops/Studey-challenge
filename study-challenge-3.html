<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programming Advices | &#x062a;&#x062d;&#x062f;&#x064a; &#x0627;&#x0644;&#x062f;&#x0631;&#x0627;&#x0633;&#x0629;</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marhey:wght@400;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#FFF3F8;
    --panel:#FFFFFF;
    --pink:#FF6FA0;
    --pink-deep:#E8548A;
    --lav:#B79CE8;
    --peach:#FFC9A8;
    --ink:#5B4358;
    --ink-dim:#A98CA3;
    --line:#F6DCE9;
    --gold:#FFC24B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 12% 8%, #FFE1EE 0%, transparent 40%),
      radial-gradient(circle at 88% 92%, #EFE3FF 0%, transparent 45%),
      var(--bg);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    padding:20px 14px 60px;
  }
  .wrap{max-width:480px;margin:0 auto;}

  .brand{
    display:flex;align-items:center;justify-content:center;gap:8px;
    margin-bottom:6px;
  }
  .brand-dot{width:8px;height:8px;border-radius:50%;background:var(--pink);}
  .brand span{
    font-size:0.72rem;letter-spacing:0.3px;color:var(--ink-dim);
    font-weight:700;
  }

  h1{
    font-family:'Marhey', sans-serif;
    font-weight:700;
    font-size:2rem;
    margin:2px 0 4px;
    text-align:center;
    color:var(--pink-deep);
  }
  .sub{color:var(--ink-dim);font-size:0.9rem;margin-bottom:20px;line-height:1.6;text-align:center;}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:20px;
    padding:20px;
    margin-bottom:16px;
    box-shadow:0 6px 20px rgba(232,84,138,0.06);
  }
  .card h2{
    font-family:'Marhey', sans-serif;
    font-size:1.2rem;
    margin:0 0 14px;
    color:var(--pink-deep);
    font-weight:700;
    display:flex;align-items:center;gap:6px;
  }
  label{display:block;font-size:0.82rem;color:var(--ink-dim);margin-bottom:6px;font-weight:700;}
  input[type=text], input[type=password], input[type=date]{
    width:100%;
    background:#FFFAFC;
    border:1.5px solid var(--line);
    color:var(--ink);
    padding:12px 14px;
    border-radius:14px;
    font-family:'Tajawal', sans-serif;
    font-size:0.95rem;
  }
  input:focus{outline:none;border-color:var(--pink);}
  .row{margin-bottom:14px;}
  button{
    font-family:'Tajawal', sans-serif;
    font-weight:800;
    font-size:0.95rem;
    border:none;
    border-radius:16px;
    padding:13px 16px;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  button:active{transform:scale(0.96);}
  .btn-main{
    background:linear-gradient(135deg, var(--pink), var(--pink-deep));
    color:#fff;width:100%;
    box-shadow:0 6px 16px rgba(232,84,138,0.35);
  }
  .btn-ghost{background:transparent;color:var(--ink-dim);border:1.5px solid var(--line);}
  .hidden{display:none !important;}

  /* daily confirm */
  .ask{
    text-align:center;
    padding:6px 0 4px;
  }
  .ask .q{
    font-family:'Marhey', sans-serif;
    font-size:1.15rem;
    color:var(--ink);
    margin-bottom:16px;
  }
  .ask-btns{display:flex;gap:10px;}
  .btn-yes{
    flex:1;
    background:linear-gradient(135deg, #8DE1B0, #59C98A);
    color:#124024;
    box-shadow:0 6px 16px rgba(89,201,138,0.3);
  }
  .btn-no{
    flex:1;
    background:#FFF0F5;
    color:var(--ink-dim);
    border:1.5px solid var(--line);
  }

  /* reveal card */
  .reveal{
    display:none;
    text-align:center;
    padding:8px 0 4px;
  }
  .reveal.show{display:block; animation:pop .45s ease;}
  @keyframes pop{
    0%{transform:scale(0.85); opacity:0;}
    60%{transform:scale(1.04); opacity:1;}
    100%{transform:scale(1);}
  }
  .reveal .emoji{font-size:2.4rem;margin-bottom:6px;}
  .reveal .rname{
    font-family:'Marhey', sans-serif;
    font-size:1.3rem;
    color:var(--pink-deep);
    margin-bottom:2px;
  }
  .reveal .rmsg{color:var(--ink-dim);font-size:0.88rem;margin-bottom:14px;}

  .progress-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .progress-head .name{font-size:0.95rem;font-weight:800;color:var(--ink);}
  .progress-head .stat{font-size:0.85rem;color:var(--pink-deep);font-weight:800;}
  .bar-track{height:10px;background:#FBE7F0;border-radius:6px;overflow:hidden;margin-bottom:16px;}
  .bar-fill{height:100%;background:linear-gradient(90deg, var(--peach), var(--pink));border-radius:6px;transition:width .4s ease;}

  .grid{
    display:grid;
    grid-template-columns:repeat(6, 1fr);
    gap:6px;
  }
  .day{
    aspect-ratio:1;
    display:flex;align-items:center;justify-content:center;
    background:#FFF6FA;
    border:1px solid var(--line);
    border-radius:10px;
    font-size:0.7rem;
    font-weight:800;
    color:var(--ink-dim);
    position:relative;
  }
  .day.today{border-color:var(--pink); color:var(--pink-deep); border-width:2px;}
  .day.done{
    background:linear-gradient(135deg, var(--peach), var(--pink));
    color:#fff;
    border-color:transparent;
  }
  .day.done::after{content:"\1F497 "; position:absolute; font-size:0.6rem; top:-5px; left:-3px;}
  .day.future{opacity:0.35;}

  .board-row{
    display:flex;align-items:center;gap:10px;
    padding:10px 2px;
    border-bottom:1px solid var(--line);
  }
  .board-row:last-child{border-bottom:none;}
  .board-row .rank{
    width:30px;min-width:30px;text-align:center;font-size:1.35rem;
    line-height:1;
  }
  .board-row .rank.empty{font-size:.85rem;color:rgba(255,255,255,.45);}
  .board-row .rank.gold{filter:drop-shadow(0 2px 3px rgba(230,169,29,.55));}
  .board-row .rank.silver{filter:drop-shadow(0 2px 3px rgba(157,168,179,.55));}
  .board-row .rank.bronze{filter:drop-shadow(0 2px 3px rgba(169,87,45,.55));}
  .board-row.me{background:#FFF3F8; border-radius:12px;}
  .board-row.me .bname{color:var(--pink-deep);}
  .board-row .bname{flex:1;font-weight:700;font-size:0.9rem;color:var(--ink);}
  .board-row .btrack{width:60px;height:6px;background:#FBE7F0;border-radius:3px;overflow:hidden;}
  .board-row .bfill{height:100%;background:linear-gradient(90deg, var(--peach), var(--pink));}
  .board-row .bmeta{font-size:0.76rem;color:var(--ink-dim);width:40px;text-align:left;}
  .empty-note{color:var(--ink-dim);font-size:0.85rem;text-align:center;padding:8px 0;}
  .course-start{
    text-align:center;
    color:var(--pink-deep);
    font-size:0.86rem;
    font-weight:800;
    line-height:1.7;
    margin:0 0 20px;
  }
  .course-countdown{
    display:inline-block;
    margin-top:4px;
    padding:6px 12px;
    border-radius:12px;
    background:#FFF3F8;
    color:var(--ink-dim);
    font-size:0.78rem;
    font-weight:700;
  }
  .switch-link{text-align:center;margin-top:10px;}
  .switch-link a{color:var(--ink-dim);font-size:0.78rem;text-decoration:underline;cursor:pointer;}
  .already-done{
    text-align:center;color:var(--ink-dim);font-size:0.88rem;
    background:#FFF3F8;border-radius:14px;padding:14px;
  }

  /* badges */
  .badges{
    display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap;
  }
  .badge{
    width:56px;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    opacity:.28;
    filter:saturate(.35);
    transition:opacity .25s ease, filter .25s ease, transform .25s ease;
  }
  .badge.earned{
    opacity:1;
    filter:saturate(1);
    transform:translateY(-2px);
  }
  .badge .bemoji{
    width:46px;height:46px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:1.35rem;
    border:2px solid #fff;
    color:#fff;
    box-shadow:0 4px 10px rgba(100,35,55,.25);
  }
  .badge:nth-child(1) .bemoji{background:linear-gradient(135deg,#ffe57a,#e6a91d);}
  .badge:nth-child(2) .bemoji{background:linear-gradient(135deg,#f5f7fa,#9da8b3);}
  .badge:nth-child(3) .bemoji{background:linear-gradient(135deg,#f3b27a,#a9572d);}
  .badge:nth-child(4) .bemoji{background:linear-gradient(135deg,#d9b7ff,#8750c7);}
  .badge .blabel{font-size:0.66rem;color:#fff;font-weight:900;text-align:center;text-shadow:0 1px 3px rgba(80,20,40,.55);}
  .badge.earned .bemoji{box-shadow:0 0 0 3px rgba(255,255,255,.65),0 5px 14px rgba(100,35,55,.35);}
  .badge:not(.earned) .bemoji{box-shadow:none;}

  /* top performer highlight */
  .top-card{
    background:linear-gradient(135deg, #FFF3F8, #FFEAF6);
    border:1.5px solid var(--line);
    border-radius:16px;
    padding:14px 16px;
    display:flex;align-items:center;gap:12px;
    margin-bottom:14px;
  }
  .top-card .crown{font-size:1.7rem;}
  .top-card .ttitle{font-size:0.72rem;color:var(--ink-dim);font-weight:700;margin-bottom:2px;}
  .top-card .tname{font-family:'Marhey', sans-serif;font-size:1.05rem;color:var(--pink-deep);}
  .top-card .tmeta{font-size:0.78rem;color:var(--ink-dim);margin-top:1px;}
  .copyright{color:#A98CA3;font-size:0.7rem;text-align:center;margin:2px 0 0;line-height:1.6;}
  .remember-row{display:flex;align-items:center;gap:7px;margin:10px 0 4px;font-size:.78rem;color:var(--ink-dim);cursor:pointer;}
  .remember-row input{accent-color:var(--pink);width:16px;height:16px;}
  .auth-message{min-height:20px;text-align:center;font-size:.8rem;font-weight:700;margin:6px 0;color:#ffeaf0;}
  .auth-message.error{color:#fff;font-weight:900;text-shadow:0 1px 3px rgba(100,0,30,.55);}
  .auth-message.success{color:#eafff1;}
  .auth-modes{display:flex;gap:8px;margin:0 0 16px;padding:4px;border:1px solid rgba(255,255,255,.35);border-radius:14px;background:rgba(91,25,52,.16);}
  .auth-mode{flex:1;padding:9px 8px;border-radius:10px;background:transparent;color:var(--ink-dim);font-size:.82rem;}
  .auth-mode.active{background:rgba(255,255,255,.34);color:#fff;font-weight:900;box-shadow:0 2px 8px rgba(91,18,45,.18);}

/* Sakura glass theme */:root{--bg:#c95072;--panel:rgba(255,232,240,.38);--pink:#f24c78;--pink-deep:#c82f5a;--ink:#fff7fa;--ink-dim:#f5d5df;--line:rgba(255,255,255,.42);--peach:#f7a6b9;--gold:#ffd45c;}body{background:radial-gradient(circle at 83% 8%,rgba(255,244,248,.92) 0 7%,transparent 18%),radial-gradient(circle at 14% 88%,rgba(255,231,240,.8) 0 8%,transparent 19%),linear-gradient(135deg,#cf5d7c,#eaa0b5 45%,#c84d70);color:var(--ink);}.card{background:rgba(255,243,247,.32);border-color:rgba(255,255,255,.48);box-shadow:0 12px 34px rgba(91,18,45,.18),inset 0 1px rgba(255,255,255,.35);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);}.card h2,.course-start,h1,.progress-head .stat,.reveal .rname,.board-row.me .bname{color:#fff4f7;text-shadow:0 1px 8px rgba(113,20,50,.2);}input[type=text],input[type=password],input[type=date]{background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.55);color:#fff;}input::placeholder,label,.brand span,.course-countdown,.top-card .ttitle,.top-card .tmeta,.reveal .rmsg,.empty-note,.switch-link a,.badge .blabel,.board-row .bmeta{color:var(--ink-dim);}.btn-main{background:linear-gradient(135deg,#ff5c83,#e83364);box-shadow:0 8px 22px rgba(154,24,62,.3);}.btn-no,.already-done,.course-countdown,.board-row.me,.day,.badge .bemoji{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.38);color:#fff;}.btn-yes{background:linear-gradient(135deg,#f6b4c5,#e87d9c);color:#6b1e39;}.bar-track,.board-row .btrack{background:rgba(255,255,255,.28);}.bar-fill,.board-row .bfill,.day.done{background:linear-gradient(90deg,#ffd0dc,#f14d7b);}.day{color:#ffeaf0;}.day.today{border-color:#fff;color:#fff;}.board-row{border-bottom-color:rgba(255,255,255,.28);}.board-row .bname{color:#fff4f7;}.top-card{background:rgba(255,222,233,.32);border-color:rgba(255,255,255,.48);box-shadow:inset 0 1px rgba(255,255,255,.3);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}.copyright{color:rgba(255,240,245,.72)!important;}/* Sakura floral refinement */body{background:linear-gradient(rgba(154,39,75,.42),rgba(205,83,116,.5)),url(https://files.manuscdn.com/user_upload_by_module/session_file/310519663958030174/vtAUaQJejRkbMrwB.jpg) center/cover fixed no-repeat;color:#fff7fa;}.card{background:rgba(255,228,237,.20);border-color:rgba(255,255,255,.30);box-shadow:0 12px 34px rgba(91,18,45,.22),inset 0 1px rgba(255,255,255,.20);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}.top-card{background:rgba(255,215,228,.22);border-color:rgba(255,255,255,.32);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}input[type=text],input[type=password],input[type=date]{background:rgba(255,220,231,.16);border-color:rgba(255,255,255,.38);color:#fff;}.btn-no,.already-done,.course-countdown,.board-row.me,.day,.badge .bemoji{background:rgba(255,220,231,.15);border-color:rgba(255,255,255,.30);}.copyright{color:rgba(255,240,245,.78)!important;}/* Clear counters and coordinated day tiles */.progress-head .stat,.reveal .rmsg,.course-countdown,.board-row .bmeta,.top-card .tmeta{font-variant-numeric:tabular-nums;font-weight:800;text-shadow:0 1px 3px rgba(92,20,48,.32);}.progress-head .stat{font-size:1rem;letter-spacing:.02em;color:#fff!important;}.reveal .rmsg{font-size:.95rem;color:#fff!important;}.course-countdown{font-size:.88rem;color:#fff!important;background:rgba(112,23,53,.34);border:1px solid rgba(255,255,255,.32);}.grid .day{background:rgba(91,25,52,.32);border:1px solid rgba(255,240,246,.48);color:#fff!important;font-size:.78rem;text-shadow:0 1px 3px rgba(72,8,30,.5);box-shadow:inset 0 1px rgba(255,255,255,.16),0 3px 8px rgba(79,12,38,.18);}.grid .day.today{background:rgba(255,205,220,.28);border:2px solid #fff;color:#fff!important;box-shadow:0 0 0 2px rgba(242,76,120,.45),0 4px 10px rgba(79,12,38,.2);}.grid .day.done{background:linear-gradient(135deg,#e889a5 0%,#d54f78 55%,#b72f5b 100%);border-color:rgba(255,245,248,.72);color:#fff!important;font-weight:900;box-shadow:inset 0 1px rgba(255,255,255,.28),0 4px 10px rgba(101,16,49,.35);}.grid .day.done::after{filter:drop-shadow(0 1px 2px rgba(91,18,45,.42));}.board-row .bmeta{font-size:.86rem;width:52px;color:#fff!important;text-align:center;background:rgba(91,25,52,.30);border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:3px 4px;}.board-row .btrack{height:8px;background:rgba(91,25,52,.34);box-shadow:inset 0 1px 2px rgba(65,8,30,.24);}.board-row .bfill{background:linear-gradient(90deg,#ffd0dc,#e45480,#b72f5b);box-shadow:0 0 5px rgba(255,181,202,.55);}.top-card .tname{font-weight:900;text-shadow:0 1px 4px rgba(92,20,48,.35);}.copyright{ text-shadow:0 1px 3px rgba(92,20,48,.25); }</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="brand-dot"></span><span>Programming Advices</span></div>
  <h1>&#x062a;&#x062d;&#x062f;&#x064a; &#x0627;&#x0644;&#x062f;&#x0631;&#x0627;&#x0633;&#x0629; &#x1f4ab;</h1>
  <div class="course-start">
    &#x062a;&#x0645; &#x0628;&#x062f;&#x0621; &#x0627;&#x0644;&#x062a;&#x062d;&#x062f;&#x064a; &#x0628; 12.9.2026
    <div class="course-countdown" id="courseCountdown"></div>
  </div>

  <div id="setupCard" class="card">
    <h2 id="authTitle">&#x1f380; &#x062f;&#x062e;&#x0648;&#x0644; &#x0627;&#x0644;&#x062a;&#x062d;&#x062f;&#x064a;</h2>
    <div class="auth-modes" role="tablist" aria-label="&#x0646;&#x0648;&#x0639; &#x0627;&#x0644;&#x062f;&#x062e;&#x0648;&#x0644;">
      <button type="button" class="auth-mode active" id="loginMode">Log in</button>
      <button type="button" class="auth-mode" id="signupMode">Sign up</button>
    </div>
    <div class="row">
      <label>&#x0627;&#x0633;&#x0645; &#x0627;&#x0644;&#x0645;&#x0633;&#x062a;&#x062e;&#x062f;&#x0645;</label>
      <input type="text" id="nameInput" placeholder="&#x0645;&#x062b;&#x0644;&#x0627;&#x064b;: &#x064a;&#x0645;&#x0627;&#x0645;&#x0629;" maxlength="24" autocomplete="username">
    </div>
    <div class="row">
      <label>&#x0643;&#x0644;&#x0645;&#x0629; &#x0627;&#x0644;&#x0645;&#x0631;&#x0648;&#x0631;</label>
      <input type="password" id="passwordInput" placeholder="&#x0623;&#x062f;&#x062e;&#x0644;&#x064a; &#x0643;&#x0644;&#x0645;&#x0629; &#x0627;&#x0644;&#x0645;&#x0631;&#x0648;&#x0631;" maxlength="64" autocomplete="current-password">
    </div>
    <div class="row hidden" id="confirmPasswordRow">
      <label>&#x062a;&#x0623;&#x0643;&#x064a;&#x062f; &#x0643;&#x0644;&#x0645;&#x0629; &#x0627;&#x0644;&#x0645;&#x0631;&#x0648;&#x0631;</label>
      <input type="password" id="confirmPasswordInput" placeholder="&#x0623;&#x0639;&#x064a;&#x062f;&#x064a; &#x0643;&#x062a;&#x0627;&#x0628;&#x0629; &#x0643;&#x0644;&#x0645;&#x0629; &#x0627;&#x0644;&#x0645;&#x0631;&#x0648;&#x0631;" maxlength="64" autocomplete="new-password">
    </div>
    <label class="remember-row"><input type="checkbox" id="rememberPassword" checked> &#x062a;&#x0630;&#x0643;&#x0631;&#x064a;&#x0646;&#x064a; &#x0639;&#x0644;&#x0649; &#x0647;&#x0630;&#x0627; &#x0627;&#x0644;&#x062c;&#x0647;&#x0627;&#x0632;</label>
    <div class="auth-message" id="authMessage" role="alert" aria-live="polite"></div>
    <button class="btn-main" id="joinBtn">&#x062f;&#x062e;&#x0648;&#x0644; &#x0627;&#x0644;&#x062a;&#x062d;&#x062f;&#x064a; &#x1f495;</button>
  </div>

  <div class="copyright">Copy Rights 2026</div>
  <div id="mainCard" class="card hidden">
    <h2 id="askTitle">&#x2600;&#xfe0f; &#x0647;&#x0644; &#x062f;&#x0631;&#x0633;&#x062a;&#x064a; &#x0627;&#x0644;&#x064a;&#x0648;&#x0645;&#x061f;</h2>

    <div class="ask" id="askBox">
      <div class="ask-btns">
        <button class="btn-yes" id="yesBtn">&#x0623;&#x0643;&#x062f;&#x064a; &#x0625;&#x0646;&#x0643; &#x062f;&#x0631;&#x0633;&#x062a;&#x0650; &#x2705;</button>
        <button class="btn-no" id="noBtn">&#x0644;&#x0633;&#x0627; &#x1f648;</button>
      </div>
    </div>

    <div class="reveal" id="revealBox">
      <div class="emoji">&#x1f389;</div>
      <div class="rname" id="revealName"></div>
      <div class="rmsg" id="revealMsg"></div>
      <div class="bar-track"><div class="bar-fill" id="revealBar" style="width:0%"></div></div>
    </div>

    <div class="already-done hidden" id="alreadyBox">
      &#x2728; &#x062e;&#x0644;&#x0635;&#x062a;&#x0650; &#x062a;&#x0623;&#x0643;&#x064a;&#x062f; &#x0627;&#x0644;&#x064a;&#x0648;&#x0645;&#x060c; &#x0631;&#x062c;&#x0639;&#x064a; &#x0628;&#x0643;&#x0631;&#x0627;!
    </div>

    <div style="margin-top:18px;">
      <div class="progress-head">
        <span class="name" id="meName"></span>
        <span class="stat" id="meStat"></span>
      </div>
      <div class="bar-track"><div class="bar-fill" id="meBar" style="width:0%"></div></div>
      <div class="grid" id="dayGrid"></div>
      <div class="badges" id="badgeRow"></div>
    </div>

    <div class="switch-link"><a id="switchUser">&#x0645;&#x0648; &#x0623;&#x0646;&#x0627;&#x061f; &#x0628;&#x062f;&#x0651;&#x0644;&#x064a; &#x0627;&#x0644;&#x0627;&#x0633;&#x0645;</a></div>
  </div>

  <div id="boardCard" class="card hidden">
    <h2>&#x1f3c6; &#x062a;&#x0631;&#x062a;&#x064a;&#x0628; &#x0627;&#x0644;&#x0631;&#x0641;&#x0642;&#x0629;</h2>
    <div class="top-card hidden" id="topCard">
      <span class="crown">&#x1f451;</span>
      <div>
        <div class="ttitle">&#x0627;&#x0644;&#x0623;&#x0643;&#x062b;&#x0631; &#x0627;&#x0644;&#x062a;&#x0632;&#x0627;&#x0645;&#x0627;&#x064b;</div>
        <div class="tname" id="topName"></div>
        <div class="tmeta" id="topMeta"></div>
      </div>
    </div>

  </div>
</div>

<script>
const TOTAL_DAYS = 30;

let currentName = null;
let startDate = null;
let days = new Array(TOTAL_DAYS).fill(false);

const setupCard = document.getElementById('setupCard');
const mainCard = document.getElementById('mainCard');
const boardCard = document.getElementById('boardCard');
const nameInput = document.getElementById('nameInput');
const passwordInput = document.getElementById('passwordInput');
const confirmPasswordInput = document.getElementById('confirmPasswordInput');
const confirmPasswordRow = document.getElementById('confirmPasswordRow');
const rememberPassword = document.getElementById('rememberPassword');
const loginMode = document.getElementById('loginMode');
const signupMode = document.getElementById('signupMode');
let authMode = 'login';
const authTitle = document.getElementById('authTitle');
const authMessage = document.getElementById('authMessage');
const courseCountdown = document.getElementById('courseCountdown');
const askBox = document.getElementById('askBox');
const revealBox = document.getElementById('revealBox');
const alreadyBox = document.getElementById('alreadyBox');

const BADGE_STEPS = [
  {days:7,  emoji:"\u{1F338}", label:"\u0667 \u0623\u064a\u0627\u0645"},
  {days:14, emoji:"\u{1F331}", label:"\u0661\u0664 \u064a\u0648\u0645"},
  {days:21, emoji:"\u{2B50}", label:"\u0662\u0661 \u064a\u0648\u0645"},
  {days:30, emoji:"\u{1F451}", label:"\u0634\u0647\u0631 \u0643\u0627\u0645\u0644"}
];

const cheer = [
  "\u0645\u0627 \u0634\u0627\u0621 \u0627\u0644\u0644\u0647 \u0639\u0644\u064a\u0643\u0650! \u0627\u0633\u062a\u0645\u0631\u064a \u0643\u0630\u0627 \u1f31f",
  "\u064a\u0648\u0645 \u062b\u0627\u0646\u064a \u0628\u0627\u0644\u062c\u064a\u0628! \u0641\u062e\u0648\u0631\u0629 \u0641\u064a\u0643\u0650 \u1f4aa",
  "\u0634\u0627\u0637\u0631\u0629! \u062e\u0637\u0648\u0629 \u0623\u0642\u0631\u0628 \u0644\u0647\u062f\u0641\u0643 \u1f3af",
  "\u0623\u062d\u0633\u0646\u062a\u0650! \u0627\u0644\u0627\u0633\u062a\u0645\u0631\u0627\u0631\u064a\u0629 \u0647\u064a \u0627\u0644\u0633\u0631 \u2728",
  "\u0628\u0631\u0627\u0641\u0648! \u0643\u0644 \u064a\u0648\u0645 \u0628\u064a\u0641\u0631\u0642 \u1f497"
];

function syriaTodayParts(){
  const parts = new Intl.DateTimeFormat("en-US", { timeZone: "Asia/Damascus", year: "numeric", month: "2-digit", day: "2-digit" }).formatToParts(new Date());
  return Object.fromEntries(parts.filter(p => p.type !== "literal").map(p => [p.type, p.value]));
}
function todayStr(){
  const p = syriaTodayParts();
  return `${p.year}-${p.month}-${p.day}`;
}
function updateCourseCountdown(){
  const [year, month, day] = todayStr().split("-").map(Number);
  const todayUtc = Date.UTC(year, month - 1, day);
  const endUtc = Date.UTC(2026, 9, 12);
  const remaining = Math.max(0, Math.round((endUtc - todayUtc) / (1000 * 60 * 60 * 24)));
  courseCountdown.textContent = remaining === 1 ? "\u0645\u062a\u0628\u0642\u064a \u064a\u0648\u0645 \u0648\u0627\u062d\u062f" : `\u0645\u062a\u0628\u0642\u064a ${remaining} \u064a\u0648\u0645`;
}
function scheduleCourseCountdown(){
  updateCourseCountdown();
  setInterval(updateCourseCountdown, 30000);
}
function dayIndexFromStart(start){
  const s = new Date(start + "T00:00:00");
  const t = new Date(todayStr() + "T00:00:00");
  return Math.floor((t - s) / (1000*60*60*24));
}

const firebaseConfig = {
  apiKey: "AIzaSyDo2zVHtgmFFCEgnTLw5A9K_0gY9bPiQ64",
  authDomain: "prog-27961.firebaseapp.com",
  projectId: "prog-27961",
  storageBucket: "prog-27961.firebasestorage.app",
  messagingSenderId: "562954020310",
  appId: "1:562954020310:web:76c3b7ec1bdd2a4c6f7077"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

async function loadConfig(){
  try{
    const doc = await db.collection('config').doc('main').get();
    if(doc.exists) return doc.data();
  }catch(e){}
  return null;
}
async function saveConfig(cfg){
  try{ await db.collection('config').doc('main').set(cfg); }catch(e){}
}
async function loadUser(name){
  try{
    const doc = await db.collection('users').doc(name).get();
    if(doc.exists) return doc.data();
  }catch(e){}
  return null;
}
async function hashPassword(password){
  const data = new TextEncoder().encode(password);
  const digest = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function setAuthMessage(text, type=''){ authMessage.textContent = text; authMessage.className = 'auth-message' + (type ? ' ' + type : ''); }
function savedLoginKey(name){ return 'studyChallengeLogin:' + name; }
function forgetSavedLogin(name){ try{ localStorage.removeItem(savedLoginKey(name)); }catch(e){} }
function rememberSavedLogin(name, passwordHash){
  try{
    if(rememberPassword.checked) localStorage.setItem(savedLoginKey(name), passwordHash);
    else forgetSavedLogin(name);
  }catch(e){}
}
function showFirstPasswordSetup(){
  authTitle.textContent = '\u1f510 \u0623\u0646\u0634\u0626\u064a \u0643\u0644\u0645\u0629 \u0645\u0631\u0648\u0631\u0643';
  confirmPasswordRow.classList.remove('hidden');
  passwordInput.autocomplete = 'new-password';
  passwordInput.placeholder = '\u0623\u0646\u0634\u0626\u064a \u0643\u0644\u0645\u0629 \u0645\u0631\u0648\u0631';
  confirmPasswordInput.required = true;
}
function showNormalLogin(){
  authTitle.textContent = '\u1f380 \u062f\u062e\u0648\u0644 \u0627\u0644\u062a\u062d\u062f\u064a';
  confirmPasswordRow.classList.add('hidden');
  passwordInput.autocomplete = 'current-password';
  passwordInput.placeholder = '\u0623\u062f\u062e\u0644\u064a \u0643\u0644\u0645\u0629 \u0627\u0644\u0645\u0631\u0648\u0631';
  confirmPasswordInput.required = false;
}
function setAuthMode(mode){
  authMode = mode;
  const signup = mode === 'signup';
  loginMode.classList.toggle('active', !signup);
  signupMode.classList.toggle('active', signup);
  if(signup){
    authTitle.textContent = '\u2728 \u0625\u0646\u0634\u0627\u0621 \u062d\u0633\u0627\u0628 \u062c\u062f\u064a\u062f';
    confirmPasswordRow.classList.remove('hidden');
    passwordInput.autocomplete = 'new-password';
    passwordInput.placeholder = '\u0623\u0646\u0634\u0626\u064a \u0643\u0644\u0645\u0629 \u0645\u0631\u0648\u0631';
    confirmPasswordInput.required = true;
    document.getElementById('joinBtn').textContent = '\u0625\u0646\u0634\u0627\u0621 \u0627\u0644\u062d\u0633\u0627\u0628 \ud83c\udf80';
  }else{
    showNormalLogin();
    document.getElementById('joinBtn').textContent = '\u062f\u062e\u0648\u0644 \u0627\u0644\u062a\u062d\u062f\u064a \ud83d\udc95';
  }
  setAuthMessage('');
}
function resetAuthForm(){
  setAuthMode('login'); nameInput.value = ''; passwordInput.value = ''; confirmPasswordInput.value = '';
  setAuthMessage('');
}
async function saveUser(name, data){
  try{ await db.collection('users').doc(name).set(data); }catch(e){}
}
async function listParticipants(){
  try{
    const snap = await db.collection('users').get();
    return snap.docs.map(d => d.data());
  }catch(e){}
  return [];
}

function renderGrid(){
  const grid = document.getElementById('dayGrid');
  grid.innerHTML = "";
  const curIdx = dayIndexFromStart(startDate);
  for(let i=0;i<TOTAL_DAYS;i++){
    const cell = document.createElement('div');
    cell.className = 'day';
    cell.textContent = i+1;
    if(days[i]) cell.classList.add('done');
    if(i === curIdx) cell.classList.add('today');
    if(i > curIdx) cell.classList.add('future');
    grid.appendChild(cell);
  }
}

function renderMeStats(){
  const done = days.filter(Boolean).length;
  document.getElementById('meName').textContent = currentName;
  document.getElementById('meStat').textContent = done + " / " + TOTAL_DAYS + " \u064a\u0648\u0645";
  document.getElementById('meBar').style.width = Math.round((done/TOTAL_DAYS)*100) + "%";
  renderBadges(done);
}

function renderBadges(done){
  const row = document.getElementById('badgeRow');
  row.innerHTML = "";
  BADGE_STEPS.forEach(step => {
    const earned = done >= step.days;
    const el = document.createElement('div');
    el.className = 'badge' + (earned ? ' earned' : '');
    el.innerHTML = `<div class="bemoji">${step.emoji}</div><div class="blabel">${step.label}</div>`;
    row.appendChild(el);
  });
}

function celebrate(){
  try{
    if(navigator.vibrate) navigator.vibrate([40, 30, 60]);
  }catch(e){}
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [880, 1108, 1318];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime + i*0.12);
      gain.gain.linearRampToValueAtTime(0.12, ctx.currentTime + i*0.12 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i*0.12 + 0.25);
      osc.connect(gain).connect(ctx.destination);
      osc.start(ctx.currentTime + i*0.12);
      osc.stop(ctx.currentTime + i*0.12 + 0.3);
    });
  }catch(e){}
}

function refreshAskState(){
  const curIdx = dayIndexFromStart(startDate);
  const inRange = curIdx >= 0 && curIdx < TOTAL_DAYS;
  revealBox.classList.remove('show');
  if(!inRange){
    askBox.classList.add('hidden');
    alreadyBox.classList.add('hidden');
    return;
  }
  if(days[curIdx]){
    askBox.classList.add('hidden');
    alreadyBox.classList.remove('hidden');
  }else{
    askBox.classList.remove('hidden');
    alreadyBox.classList.add('hidden');
  }
}

async function persist(){
  await saveUser(currentName, {name: currentName, startDate, days});
  renderBoard();
}

async function renderBoard(){
  const users = await listParticipants();

  if(!users.length){
    document.getElementById('boardList').innerHTML = '<div class="empty-note">\u0644\u0633\u0627 \u0645\u062d\u062f \u0627\u0646\u0636\u0645 \u063a\u064a\u0631\u0643 \u1f331</div>';
    boardCard.classList.remove('hidden');
    return;
  }
  const entries = users.map(d => ({
    name: d.name,
    done: (d.days || []).filter(Boolean).length
  }));
  entries.sort((a,b) => b.done - a.done);




  const topCard = document.getElementById('topCard');
  if(entries.length && entries[0].done > 0){
    topCard.classList.remove('hidden');
    const leaders = entries.filter(e => e.done === entries[0].done); document.getElementById('topName').textContent = leaders.map(e => e.name).join('\u060c ');
    document.getElementById('topMeta').textContent = `${entries[0].done}/${TOTAL_DAYS} \u064a\u0648\u0645 \u2014 \u0627\u0644\u0623\u0643\u062b\u0631 \u0627\u0644\u062a\u0632\u0627\u0645\u0627\u064b \u1f4aa`;
  } else {
    topCard.classList.add('hidden');
  }

  const medals = ["\u{1F947}","\u{1F948}","\u{1F949}"];
  const medalClasses = ["gold","silver","bronze"];
  const scoreGroups = [...new Set(entries.map(e => e.done))];
  const list = document.getElementById('boardList');
  list.innerHTML = "";
  entries.forEach((e) => {
    const row = document.createElement('div');
    row.className = 'board-row' + (e.name === currentName ? ' me' : '');
    const pct = Math.round((e.done/TOTAL_DAYS)*100);
    const medalIndex = scoreGroups.indexOf(e.done);
    row.innerHTML = `
      <span class="rank ${medalIndex < 3 ? medalClasses[medalIndex] : 'empty'}">${medalIndex < 3 ? medals[medalIndex] : ''}</span>
      <span class="bname">${e.name}</span>
      <span class="btrack"><span class="bfill" style="width:${pct}%"></span></span>
      <span class="bmeta">${e.done}/${TOTAL_DAYS}</span>
    `;
    list.appendChild(row);
  });
  boardCard.classList.remove('hidden');
}

let boardRefreshTimer = null;
function startBoardAutoRefresh(){
  if(boardRefreshTimer) clearInterval(boardRefreshTimer);
  boardRefreshTimer = setInterval(() => {
    if(currentName) renderBoard();
  }, 6000);
}

async function confirmToday(){
  const curIdx = dayIndexFromStart(startDate);
  if(curIdx < 0 || curIdx >= TOTAL_DAYS) return;
  days[curIdx] = true;
  await persist();
  renderGrid();
  renderMeStats();
  celebrate();

  const done = days.filter(Boolean).length;
  document.getElementById('revealName').textContent = currentName;
  document.getElementById('revealMsg').textContent = cheer[Math.floor(Math.random()*cheer.length)] + `  \u2022  ${done}/${TOTAL_DAYS} \u064a\u0648\u0645`;
  document.getElementById('revealBar').style.width = Math.round((done/TOTAL_DAYS)*100) + "%";

  askBox.classList.add('hidden');
  revealBox.classList.add('show');
  setTimeout(() => {
    revealBox.classList.remove('show');
    alreadyBox.classList.remove('hidden');
  }, 2200);
}

async function enterChallenge(name, chosenStart, passwordHash){
  let cfg = await loadConfig();
  if(!cfg){ cfg = {startDate: chosenStart || todayStr()}; await saveConfig(cfg); }
  startDate = cfg.startDate;
  const user = await loadUser(name);
  if(!user){ setAuthMessage('\u0627\u0633\u0645 \u0627\u0644\u0645\u0633\u062a\u062e\u062f\u0645 \u063a\u064a\u0631 \u0635\u062d\u064a\u062d. \u062a\u0623\u0643\u062f\u064a \u0645\u0646 \u0643\u062a\u0627\u0628\u062a\u0647 \u0643\u0645\u0627 \u0647\u0648.', 'error'); return false; }
  if(!user.passwordHash){
    const password = passwordInput.value;
    const confirmation = confirmPasswordInput.value;
    if(password.length < 4){ setAuthMessage('\u0623\u0646\u0634\u0626\u064a \u0643\u0644\u0645\u0629 \u0645\u0631\u0648\u0631 \u0645\u0646 4 \u0623\u062d\u0631\u0641 \u0623\u0648 \u0623\u0643\u062b\u0631.', 'error'); return false; }
    if(password !== confirmation){ setAuthMessage('\u0643\u0644\u0645\u062a\u0627 \u0627\u0644\u0645\u0631\u0648\u0631 \u063a\u064a\u0631 \u0645\u062a\u0637\u0627\u0628\u0642\u062a\u064a\u0646.', 'error'); return false; }
    passwordHash = await hashPassword(password);
    await saveUser(name, {...user, passwordHash});
    setAuthMessage('\u062a\u0645 \u0625\u0646\u0634\u0627\u0621 \u0643\u0644\u0645\u0629 \u0627\u0644\u0645\u0631\u0648\u0631 \u0648\u062d\u0641\u0638\u0647\u0627 \u0628\u0646\u062c\u0627\u062d.', 'success');
  } else {
    if(!passwordHash) passwordHash = await hashPassword(passwordInput.value);
    if(passwordHash !== user.passwordHash){
      forgetSavedLogin(name);
      setAuthMessage('\u0643\u0644\u0645\u0629 \u0627\u0644\u0645\u0631\u0648\u0631 \u063a\u064a\u0631 \u0635\u062d\u064a\u062d\u0629.', 'error'); return false;
    }
  }
  rememberSavedLogin(name, passwordHash);
  currentName = user.name; days = user.days || new Array(TOTAL_DAYS).fill(false);
  setupCard.classList.add('hidden'); mainCard.classList.remove('hidden');
  renderGrid(); renderMeStats(); refreshAskState(); renderBoard(); startBoardAutoRefresh();
  return true;
}

async function attemptLogin(){
  const name = nameInput.value.trim();
  const password = passwordInput.value;
  if(!name){ setAuthMessage('\u0627\u0643\u062a\u0628\u064a \u0627\u0633\u0645 \u0627\u0644\u0645\u0633\u062a\u062e\u062f\u0645 \u0623\u0648\u0644\u0627\u064b.', 'error'); nameInput.focus(); return; }
  if(authMode === 'signup'){
    if(name.length < 2){ setAuthMessage('\u0627\u0633\u0645 \u0627\u0644\u0645\u0633\u062a\u062e\u062f\u0645 \u0642\u0635\u064a\u0631 \u062c\u062f\u0627\u064b.', 'error'); return; }
    if(password.length < 4){ setAuthMessage('\u0623\u0646\u0634\u0626\u064a \u0643\u0644\u0645\u0629 \u0645\u0631\u0648\u0631 \u0645\u0646 4 \u0623\u062d\u0631\u0641 \u0623\u0648 \u0623\u0643\u062b\u0631.', 'error'); return; }
    if(password !== confirmPasswordInput.value){ setAuthMessage('\u0643\u0644\u0645\u062a\u0627 \u0644\u0645\u0631\u0648\u0631 \u063a\u064a\u0631 \u0645\u062a\u0637\u0627\u0628\u0642\u062a\u064a\u0646.', 'error'); return; }
    const existing = await loadUser(name);
    if(existing){ setAuthMessage('\u0647\u0630\u0627 \u0627\u0633\u0645 \u0627\u0644\u0645\u0633\u062a\u062e\u062f\u0645 \u0645\u0633\u062c\u0644 \u0645\u0633\u0628\u0642\u0627\u064b. \u0627\u0633\u062a\u062e\u062f\u0645\u064a Log in.', 'error'); return; }
    const passwordHash = await hashPassword(password);
    const cfg = await loadConfig();
    const newUser = {name, startDate:(cfg && cfg.startDate) || todayStr(), days:new Array(TOTAL_DAYS).fill(false), passwordHash};
    await saveUser(name, newUser);
    rememberSavedLogin(name, passwordHash);
    setAuthMessage('\u062a\u0645 \u0625\u0646\u0634\u0627\u0621 \u062d\u0633\u0627\u0628\u0643 \u0628\u0646\u062c\u0627\u062d.', 'success');
    await enterChallenge(name, newUser.startDate, passwordHash);
    return;
  }
  const user = await loadUser(name);
  if(!user){ setAuthMessage('\u0627\u0633\u0645 \u0627\u0644\u0645\u0633\u062a\u062e\u062f\u0645 \u063a\u064a\u0631 \u0645\u0648\u062c\u0648\u062f. \u0625\u0630\u0627 \u0644\u062f\u064a\u0643 \u062d\u0633\u0627\u0628 \u0627\u0633\u062a\u062e\u062f\u0645\u064a Log in، \u0623\u0648 \u0627\u0646\u062a\u0642\u0644\u064a \u0625\u0644\u0649 Sign up.', 'error'); return; }
  if(!user.passwordHash){ showFirstPasswordSetup(); }
  const savedHash = (() => { try{return localStorage.getItem(savedLoginKey(name));}catch(e){return null;} })();
  if(user.passwordHash && savedHash === user.passwordHash){ await enterChallenge(name, null, savedHash); return; }
  if(user.passwordHash && !password){ setAuthMessage('\u0623\u062f\u062e\u0644\u064a \u0643\u0644\u0645\u0629 \u0627\u0644\u0645\u0631\u0648\u0631 \u0644\u0644\u0645\u062a\u0627\u0628\u0639\u0629.', 'error'); passwordInput.focus(); return; }
  await enterChallenge(name, null, null);
}
loginMode.addEventListener('click', () => setAuthMode('login'));
signupMode.addEventListener('click', () => setAuthMode('signup'));
document.getElementById('joinBtn').addEventListener('click', attemptLogin);
[nameInput, passwordInput, confirmPasswordInput].forEach(input => input.addEventListener('keydown', e => { if(e.key === 'Enter') attemptLogin(); }));

document.getElementById('yesBtn').addEventListener('click', confirmToday);
document.getElementById('noBtn').addEventListener('click', () => {
  document.getElementById('revealName').textContent = "";
  askBox.classList.add('hidden');
  setTimeout(() => { askBox.classList.remove('hidden'); }, 10);
});

document.getElementById('switchUser').addEventListener('click', () => {
  mainCard.classList.add('hidden');
  boardCard.classList.add('hidden');
  setupCard.classList.remove('hidden');
  resetAuthForm();
  nameInput.focus();
});

(async function init(){
  await loadConfig();
  scheduleCourseCountdown();
  try{
    const saved = Object.keys(localStorage).find(k => k.startsWith('studyChallengeLogin:'));
    if(saved){
      const name = saved.slice('studyChallengeLogin:'.length);
      const hash = localStorage.getItem(saved);
      const user = await loadUser(name);
      if(user && user.passwordHash === hash) await enterChallenge(name, null, hash);
    }
  }catch(e){}
})();
</script>
